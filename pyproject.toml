[project]
name = "tracker"
version = "0.1.0"
description = "Portfolio tracker for collectibles and assets"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jacob" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "py-moneyed>=3.0,<4.0",
    "httpx>=0.27,<0.28",
    "apify-client>=1.8,<2.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
firecrawl = ["firecrawl-py>=1.0,<2.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-httpx>=0.32,<0.33",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "ASYNC"]
ignore = [
    "E501",   # line-length is enforced by the formatter
    "B008",   # false positive: FastAPI's Depends() belongs in default args
    "UP046",  # PEP 695 generic syntax not universally friendly with Pydantic yet
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apify_client.*", "moneyed.*"]
ignore_missing_imports = true
